name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and build Admin and Marketplace
        run: npm run build
      - name: Stage two demo routes
        run: npm run stage:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Admin and Marketplace demos
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/pages/deploy-separate-pages-demos/blockchain-integration-service
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
