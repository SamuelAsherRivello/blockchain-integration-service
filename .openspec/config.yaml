schema: spec-driven
context: |
  Repository: blockchain-integration-service.
  Source baseline: documentation/BGS_PROJECT_BRIEF.md. Later decisions: documentation/design-discussion.md.
  Approved structure: packages/integration (core, ui, arkade) and packages/integration-demo (admin, preview).
  Current implementation: A1 entry and A2 creation, recovery, encrypted persistence, minimal active Account, and demo first-run reset; manual reset verification pending.
  Arkade SDK creates real Signet identities with transient repositories. A6 local logout is implemented with manual storage verification pending; A3 account-access restoration is implemented and verified against Signet; A4 available/total balances and Refresh are implemented with no persisted/stale fallback, funded Signet verification pending; A5 Transactions is implemented with SDK full available history, three-line rows, detail Copy and full-list Copy-all. Live outgoing and confirmed-state rendering are observed; the same-transaction confirmation transition and independent spent-history evidence remain pending. Receiving addresses are implemented. Generic asset mint/list APIs and an Admin-only mint modal/list console are implemented. On 2026-09-04 the real Admin minted another Level 1 asset for the reported identity using SDK 0.4.67 and a fresh list returned both the external and BIS assets. Earlier transfer/funding blockers are historical, not current diagnoses; broad recovery work stays separate. Assets have no BIS game-specific rules.
  React + TypeScript. Game is a separate repository.
  Signet only. Arkade SDK only for v1. No custom application server.
  No simulated transaction outcomes; the harness may simulate game events only.
  Game remains playable without an account or connectivity.
  Preserve Frontend, Core Services, and Arkade Integration responsibilities.
  Do not log or commit recovery phrases or other secrets.
rules:
  proposal:
    - Mark unresolved decisions; recommendations are not approved decisions.
  design:
    - Keep the game-facing API free of Arkade-specific types.
    - Verify current Signet capabilities before claiming feasibility.
  tasks:
    - Keep planning and implementation phases explicit.

