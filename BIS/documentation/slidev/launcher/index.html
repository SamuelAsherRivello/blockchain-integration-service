      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #181a20; color: #f3f4f6; }

      section { display: grid; gap: .75rem; }
      h2 { color: #b5bac7; font-size: .875rem; letter-spacing: .08em; margin: 0; text-transform: uppercase; }
      a { border: 1px solid #4b5563; border-radius: .75rem; color: inherit; padding: 1rem; text-decoration: none; }
      a:hover { background: #272b35; border-color: #8b5cf6; }
    </style>
