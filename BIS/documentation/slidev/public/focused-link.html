<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focused link</title>
    <link id="destination-favicon" rel="icon">
    <style>
      :root { --panel: #090a0c; --white: #fff; --blue: #1464e8; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--white); background: var(--panel); font-family: system-ui, sans-serif; }
      main { display: grid; grid-template-rows: 100px minmax(0, 1fr); min-height: 100vh; }
      header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 72px; overflow: hidden; border-bottom: 5px solid var(--blue); }
      p { position: relative; z-index: 1; margin: 0; font-size: clamp(1.15rem, 2vw, 1.6rem); line-height: 1.2; }
      #open-direct { position: relative; z-index: 1; flex: 0 0 auto; color: var(--white); font-weight: 700; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      .error { display: grid; place-items: center; padding: 2rem; color: var(--white); text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header><p><strong id="name"></strong><span id="message"></span></p><a id="open-direct" target="_blank" rel="noopener noreferrer">Open in a new window ↗</a></header>
      <iframe id="site" title="Focused external site"></iframe>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const name = params.get('name') || 'Link'
      const message = params.get('message') || ''
      const url = params.get('url') || ''
      const mode = params.get('mode') || 'frame'
      const frame = document.querySelector('#site')
      const directLink = document.querySelector('#open-direct')
      document.title = name
      document.querySelector('#name').textContent = name
      document.querySelector('#message').textContent = message ? ` - ${message}` : ''
      try {
        const destination = new URL(url)
        if (!['http:', 'https:'].includes(destination.protocol)) throw new Error('Unsupported URL')
        document.querySelector('#destination-favicon').href = `${destination.origin}/favicon.ico`
        directLink.href = destination.href
        // Arkade and GitHub block third-party framing; direct navigation also
        // supports focused-link URLs generated before the explicit mode.
        const directOnlyHosts = new Set(['arkadeos.com', 'github.com'])
        if (mode === 'direct' || directOnlyHosts.has(destination.hostname)) frame.replaceWith(Object.assign(document.createElement('p'), {
          className: 'error',
          textContent: 'This destination opens directly in a new window.',
        }))
        else frame.src = destination.href
        frame.title = `${name} website`
      } catch {
        frame.replaceWith(Object.assign(document.createElement('p'), {
          className: 'error',
          textContent: 'This focused link does not have a valid web address.',
        }))
      }
    </script>
  </body>
</html>
